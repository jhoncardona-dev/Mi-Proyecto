name: CI/CD FastAPI → DockerHub + GHCR

on:
  push:
    branches: [ master, main, develop, escenario-4-cicd ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

env:
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/app-cicd-fastapi
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/app-cicd-fastapi

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias y ejecutar tests
        working-directory: escenario-4-cicd/ejercicio
        run: |
          pip install -r src/requirements.txt
          pytest tests/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_IMAGE }}
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      - name: Build imagen
        uses: docker/build-push-action@v5
        with:
          context: escenario-4-cicd/ejercicio
          file: escenario-4-cicd/ejercicio/Dockerfile
          push: false
          load: true
          tags: local-scan:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local-scan:latest
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH

      - name: Build y Push
        uses: docker/build-push-action@v5
        with:
          context: escenario-4-cicd/ejercicio
          file: escenario-4-cicd/ejercicio/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
